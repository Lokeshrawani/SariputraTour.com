    function renderPackages(data) {
        const grid = document.getElementById('packagesGrid');
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-image-wrap">
                    <img src="${item.image}" alt="${item.title}" loading="lazy">
                    <span class="card-tag">${item.tag}</span>
                    <span class="card-duration">⌛ ${item.duration}</span>
                </div>
                <div class="card-body">
                    <h3 class="card-title">${item.title}</h3>
                    <div class="card-route">📍 ${item.route}</div>
                    <div class="card-highlights">
                        <div class="highlight-item"><span>Hotel Stay:</span><strong>${item.hotelDetails}</strong></div>
                        <div class="highlight-item"><span>Vehicle Included:</span><strong>${item.vehicle}</strong></div>
                    </div>
                    <div class="included-icons">
                        <span class="icon-pill">🚗 AC Ride</span>
                        <span class="icon-pill">🏨 Hotel</span>
                        <span class="icon-pill">☕ Breakfast</span>
                    </div>
                    <div class="card-footer">
                        <div class="price-box">
                            <span style="font-size:11px; color:#64748b; text-transform:uppercase;">Starts From</span>
                            <div><span class="price-value">₹${item.priceStarting.toLocaleString('en-IN')}</span><span style="font-size:11px;">/person</span></div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-details" onclick="openModal('${item.id}')">View Details</button>
                            <a href="https://wa.me/919939995360?text=Hello%20Sariputra%20Tour%2C%20I%20am%20interested%20in%20the%20*${encodeURIComponent(item.title)}*%20package." target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(cat) {
        document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        if (cat === 'all') renderPackages(packagesData);
        else renderPackages(packagesData.filter(item => item.category === cat));
    }

    function searchPackages() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        renderPackages(packagesData.filter(item => 
            item.title.toLowerCase().includes(query) || item.route.toLowerCase().includes(query)
        ));
    }

    function openModal(id) {
        const pkg = packagesData.find(p => p.id === id);
        if (!pkg) return;
        document.getElementById('modalTitle').innerText = pkg.title + ' (' + pkg.duration + ')';
        document.getElementById('modalRoute').innerText = 'Route: ' + pkg.route;

        const pricingTbody = document.getElementById('modalPricingTable');
        pricingTbody.innerHTML = '';
        pkg.pricingOptions.forEach(row => {
            pricingTbody.innerHTML += `<tr><td style="font-weight:600;">${row.category}</td><td>${row.perDay}</td><td style="color:var(--primary); font-weight:700;">${row.total}</td></tr>`;
        });

        const itineraryContainer = document.getElementById('modalItinerary');
        itineraryContainer.innerHTML = '';
        pkg.itinerary.forEach(day => {
            itineraryContainer.innerHTML += `<div class="day-box"><div style="font-weight:700;">${day.day}</div><div style="font-size:13.5px; color:#475569;">${day.desc}</div></div>`;
        });

        document.getElementById('modalWhatsappBtn').href = `https://wa.me/919939995360?text=Hello%20Sanjiv%20Singh%2C%20I%20want%20to%20book%20the%20*${encodeURIComponent(pkg.title)}*%20(${encodeURIComponent(pkg.duration)}).%20Please%20send%20final%20quotation.`;
        document.getElementById('packageModal').classList.add('active');
    }

    function closeModal() { document.getElementById('packageModal').classList.remove('active'); }

    // Initial Render
    renderPackages(packagesData);
</script>
