<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Tour Package Cards CSS -->
<style>
    :root {
        --primary: #8b1e0f;
        --primary-dark: #661207;
        --accent: #d97706;
        --accent-light: #fef3c7;
        --bg-body: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
        --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.08);
        --radius: 16px;
    }

    .container { max-width: 1240px; margin: 0 auto; }
    .section-header { text-align: center; margin-bottom: 32px; }
    .badge-tag { display: inline-block; background: #fef3c7; color: #b45309; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; padding: 6px 14px; border-radius: 50px; margin-bottom: 12px; }
    .section-title { font-size: 32px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; letter-spacing: -0.5px; }
    .section-subtitle { font-size: 16px; color: var(--text-muted); max-width: 650px; margin: 0 auto; }

    .controls-wrapper { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 28px; background: #ffffff; padding: 16px; border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn-filter { background: #f1f5f9; border: none; color: var(--text-muted); padding: 10px 18px; border-radius: 50px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
    .btn-filter:hover, .btn-filter.active { background: var(--primary); color: #ffffff; box-shadow: 0 4px 12px rgba(139, 30, 15, 0.25); }

    .search-box { position: relative; min-width: 260px; flex-grow: 1; max-width: 320px; }
    .search-box input { width: 100%; padding: 10px 16px 10px 38px; border-radius: 50px; border: 1px solid var(--border-color); font-size: 14px; outline: none; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }

    .packages-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
    .card { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border-color); overflow: hidden; box-shadow: var(--shadow-sm); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; position: relative; }
    .card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
    .card-image-wrap { position: relative; height: 210px; overflow: hidden; }
    .card-image-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-image-wrap img { transform: scale(1.06); }
    .card-tag { position: absolute; top: 14px; left: 14px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); color: #ffffff; font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 50px; text-transform: uppercase; }
    .card-duration { position: absolute; bottom: 14px; right: 14px; background: #ffffff; color: var(--text-main); font-weight: 800; font-size: 12px; padding: 6px 12px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }

    .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-title { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
    .card-route { font-size: 13px; color: var(--primary); font-weight: 600; margin-bottom: 14px; }
    .card-highlights { background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 16px; border: 1px solid #edf2f7; }
    .highlight-item { font-size: 12.5px; color: #475569; display: flex; justify-content: space-between; margin-bottom: 6px; }
    .included-icons { display: flex; gap: 12px; margin-bottom: 18px; font-size: 12px; color: var(--text-muted); }
    .icon-pill { display: flex; align-items: center; gap: 4px; background: #f1f5f9; padding: 4px 10px; border-radius: 6px; }

    .card-footer { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; }
    .price-value { font-size: 22px; font-weight: 800; color: var(--primary); }
    .card-actions { display: flex; gap: 8px; }
    .btn-details { background: #ffffff; border: 1px solid var(--border-color); color: var(--text-main); padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-whatsapp { background: #25d366; color: #ffffff; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 9999; padding: 16px; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #ffffff; border-radius: 20px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
    .modal-close { position: absolute; top: 20px; right: 20px; background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
    .day-box { border-left: 3px solid var(--primary); background: #f8fafc; padding: 12px 16px; border-radius: 0 10px 10px 0; margin-bottom: 10px; }
    .price-breakdown-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }
    .price-breakdown-table th, .price-breakdown-table td { padding: 10px; border: 1px solid var(--border-color); }
</style>
